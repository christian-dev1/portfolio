<article
  class="project-card"
  [appCardToggle]="swappable()"
  #toggle="cardToggle"
  [class.project-card--team]="project().context === 'collaboration'"
  [class.project-card--swapped]="toggle.active()"
>
  <p class="project-card__tab">{{ tabKey() | transloco }}</p>

  <div class="project-card__panel glass" #panel>
    <div class="project-card__visual" #visual>
      <div class="project-card__cover">
        @if (project().coverUrl; as coverUrl) {
          <img
            class="project-card__cover-image"
            [src]="coverUrl"
            [alt]="'projects.coverAlt' | transloco: { name: project().name }"
          />
        } @else {
          <div class="project-card__cover-generated brand-pattern" aria-hidden="true">
            <span class="project-card__cover-name">{{ project().name }}</span>
            <span class="project-card__cover-tagline glass glass--on-brand">
              {{ project().coverTagline | localize }}
            </span>
          </div>
        }
      </div>
      <div class="project-card__band" aria-hidden="true"></div>

      <div class="project-card__emblem" [class.project-card__emblem--logo]="!!project().logoUrl">
        @if (project().logoUrl; as logoUrl) {
          <img [src]="logoUrl" [alt]="project().name" width="72" height="72" />
        } @else {
          <span class="project-card__initials" aria-hidden="true">{{ initials() }}</span>
        }
      </div>
    </div>

    <app-project-details
      class="project-card__content"
      #content
      [project]="project()"
      [headingLevel]="headingLevel()"
      [linksFocusable]="linksFocusable()"
    />
  </div>
</article>
