<ul class="social-links" [attr.aria-label]="'social.label' | transloco">
  @for (item of items(); track item.network) {
    <li>
      <a
        class="social-links__link glass glass--on-brand"
        [class.social-links__link--dark-ink]="item.icon.inkOnHex === 'dark'"
        [style.--brand-hex]="item.icon.hex"
        [href]="item.href"
        [attr.target]="item.external ? '_blank' : null"
        [attr.rel]="item.external ? 'noopener noreferrer' : null"
        [attr.aria-label]="item.labelKey | transloco"
      >
        <app-brand-icon [icon]="item.icon" />
      </a>
    </li>
  }
</ul>
