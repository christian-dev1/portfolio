<footer class="footer">
  <svg
    class="footer__edge"
    aria-hidden="true"
    focusable="false"
    viewBox="0 0 1440 80"
    preserveAspectRatio="none"
  >
    <polygon class="footer__edge-red" points="0,62 1440,6 1440,22 0,78" />
    <polygon class="footer__edge-blue" points="0,80 0,78 1440,22 1440,80" />
  </svg>

  <div class="footer__content">
    @if (profile(); as profile) {
      <p class="footer__copyright">© {{ year }} {{ profile.fullName }} — {{ profile.brand }}</p>
      <app-social-links [profile]="profile" />
    }
  </div>
</footer>
