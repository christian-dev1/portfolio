<header class="header">
  <div class="header__pill glass">
    <a class="header__brand" routerLink="/">LUCHRIST</a>

    <nav class="header__nav" [attr.aria-label]="'nav.mainLabel' | transloco">
      <ul>
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              {{ item.labelKey | transloco }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="header__actions">
      <button
        type="button"
        class="header__icon-button"
        (click)="toggleLanguage()"
        [attr.aria-label]="'language.switchLabel' | transloco"
      >
        {{ 'language.switchShort' | transloco }}
      </button>

      <button
        type="button"
        class="header__icon-button"
        (click)="toggleTheme()"
        [attr.aria-label]="themeLabelKey() | transloco"
      >
        @if (isDark()) {
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        } @else {
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        }
      </button>
    </div>
  </div>
</header>
