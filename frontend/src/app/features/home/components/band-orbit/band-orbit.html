@if (layout(); as layout) {
  <svg width="100%" height="100%" focusable="false">
    <defs>
      <clipPath [attr.id]="id + '-clip'">
        <rect x="0" [attr.y]="layout.bandY - 4" [attr.width]="layout.width" height="8" />
        <path [attr.d]="donut()" clip-rule="evenodd" />
      </clipPath>
      @for (stream of streams(); track stream.side) {
        <path [attr.id]="id + '-' + stream.side" [attr.d]="stream.path" />
        <linearGradient
          [attr.id]="id + '-gradient-' + stream.side"
          gradientUnits="userSpaceOnUse"
          [attr.x1]="stream.fade.from.x"
          [attr.y1]="stream.fade.from.y"
          [attr.x2]="stream.fade.to.x"
          [attr.y2]="stream.fade.to.y"
        >
          <stop offset="0" stop-color="white" />
          <stop offset="1" stop-color="black" />
        </linearGradient>
        <!-- Keep the incoming band opaque; only this stream’s ending is faded and clipped. -->
        <mask [attr.id]="id + '-mask-' + stream.side">
          <rect width="100%" height="100%" fill="white" />
          <rect
            class="band-orbit__fade"
            [attr.x]="stream.gap.to.x - fadeZone"
            [attr.y]="stream.gap.to.y - fadeZone"
            [attr.width]="fadeZone * 2"
            [attr.height]="fadeZone * 2"
            [attr.fill]="'url(#' + id + '-gradient-' + stream.side + ')'"
          />
          <path class="band-orbit__gap" [attr.d]="stream.gapPath" fill="black" />
        </mask>
      }
    </defs>
    <g [attr.clip-path]="'url(#' + id + '-clip)'">
      @for (stream of streams(); track stream.side) {
        <text [attr.mask]="'url(#' + id + '-mask-' + stream.side + ')'" dominant-baseline="central">
          <textPath
            [attr.href]="'#' + id + '-' + stream.side"
            [attr.startOffset]="-period()"
            [attr.textLength]="textLength()"
            lengthAdjust="spacingAndGlyphs"
          >
            {{ repeatedText() }}
            @if (!reducedMotion()) {
              <animate
                attributeName="startOffset"
                [attr.from]="-period()"
                to="0"
                [attr.dur]="period() / 18 + 's'"
                repeatCount="indefinite"
              />
            }
          </textPath>
        </text>
      }
    </g>
  </svg>
}
