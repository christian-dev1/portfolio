<app-page-banner
  eyebrowKey="projects.eyebrow"
  titleKey="projects.title"
  introKey="projects.intro"
  countLabelKey="projects.countLabel"
  [count]="projects()?.length"
/>

<section class="projects">
  @if (projects(); as projectList) {
    <div class="projects__grid">
      @for (project of projectList; track project.id) {
        <app-project-flip-card class="reveal" [project]="project" />
      } @empty {
        <p>{{ 'projects.empty' | transloco }}</p>
      }
    </div>
  } @else {
    <p>{{ 'projects.loading' | transloco }}</p>
  }
</section>
