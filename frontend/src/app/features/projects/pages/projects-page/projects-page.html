<section class="projects">
  <h1>{{ 'projects.title' | transloco }}</h1>
  <p class="projects__intro">{{ 'projects.intro' | transloco }}</p>

  @if (projects(); as projectList) {
    <div class="projects__grid">
      @for (project of projectList; track project.id) {
        <app-project-card [project]="project" />
      } @empty {
        <p>{{ 'projects.empty' | transloco }}</p>
      }
    </div>
  } @else {
    <p>{{ 'projects.loading' | transloco }}</p>
  }
</section>
