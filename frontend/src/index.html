<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>LUCHRIST — Développeur Backend &amp; QA</title>
    <meta
      name="description"
      content="Portfolio de Christian Luther (LUCHRIST), développeur Backend &amp; QA : projets et boîte à outils."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('luchrist-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
