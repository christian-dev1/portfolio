spring:
  application:
    name: portfolio-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USER:portfolio}
    password: ${DB_PASSWORD:portfolio}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 16

  mvc:
    problemdetails:
      enabled: true

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

portfolio:
  contact:
    email-limit: 3
    ip-limit: 5
    window: 1h
    retention: 180d
    max-attempts: 5
    retry-max-age: 24h
    to: ${CONTACT_TO:}
    from: ${CONTACT_FROM:noreply@example.com}

springdoc:
  api-docs:
    path: /api/docs
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /api/docs/ui
    enabled: ${API_DOCS_ENABLED:true}
